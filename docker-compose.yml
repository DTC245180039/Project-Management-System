
version: '3.8'
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: pm_postgres_db
    restart: always
    environment:
      POSTGRES_DB: project_management_db
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: StrongPassword_DB_2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pm.com
      PGADMIN_DEFAULT_PASSWORD: StrongPassword_PgAdmin_2026!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend_net
      - backend_net

  web_app:
    build: ./app
    container_name: pm_web_app
    restart: always
    environment:
      PORT: 3000
      DB_HOST: postgres_db
      DB_NAME: project_management_db
      DB_USER: pm_user
      DB_PASSWORD: StrongPassword_DB_2026!
    depends_on:
      - postgres_db
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_app
    networks:
      - frontend_net
